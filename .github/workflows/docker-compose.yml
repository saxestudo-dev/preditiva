
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: preditiva
      POSTGRES_USER: preditiva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preditiva -d preditiva"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://preditiva:${POSTGRES_PASSWORD:-change-this-database-password}@db:5432/preditiva
      UPLOAD_DIR: /app/private_uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/private_uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:
  uploads:

networks:
  internal:
    driver: bridge
